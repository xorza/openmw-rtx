# A pin that never moves keeps whatever flaw its commit had.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    # A release that was itself the attack is usually found and pulled within days.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
