# All of the fork's CI, through the same `omw` driver the desk uses.
#
# `omw full` builds every program and runs every suite: on Ubuntu with GCC, with Clang (built, not
# run), and on Windows with MSVC. macOS is compiled only: no device there traces rays, and `hdiutil`
# fails on the runner's own "Resource busy". Upstream's GitLab checks run here too: the source checks,
# warnings as errors, and its integration tests under Xvfb on the OpenGL renderer. No hosted runner
# has a GPU, so `rtx-gpu-tests` is left out and the gate stays on a box with a card.
#
# **Each system on its newest image, Linux apart**: Ubuntu 24.04 is the base the AppImage is built on,
# and an AppImage runs on no system older than its own, so CI tests the base the package ships from.
#
# **Job names are the `master` ruleset's required checks**: rename one and the ruleset waits for a
# check that never reports. Actions are pinned to a commit, the token only reads, and a newer push
# cancels the run it supersedes.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Nothing by default, and each job names what it needs.
permissions: {}

env:
  # A filter that matches nothing is a failure and not a pass, on a Google Test that reads this;
  # an older one ignores it.
  GTEST_FAIL_IF_NO_TEST_SELECTED: "1"

# A push supersedes the push before it on the same ref. A run asked for by hand stands alone: it is
# wanted whole, and a push in the meantime must neither cancel it nor be cancelled by it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: clang-format 14, the version upstream pins, and Qt's lupdate
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14 qt6-l10n-tools

      - name: clang-format
        run: CLANG_FORMAT=clang-format-14 CI/check_clang_format.sh

      - name: CMake files indented with spaces
        run: CI/check_cmake_format.sh

      - name: File names
        run: CI/check_file_names.sh

      - name: Qt translations
        # Upstream's own check: the translation sources are regenerated and must not change.
        run: LUPDATE=/usr/lib/qt6/bin/lupdate CI/check_qt_translations.sh

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: The driver, linted and type-checked
        # Ruff's default rules at the tree's 120 columns, and mypy, both pinned, both against the oldest
        # Python `omw` supports.
        run: |
          pipx run ruff==0.16.9 check --line-length 120 --target-version py311 tools/omw omw
          MYPYPATH=tools pipx run mypy==2.3.1 --python-version 3.11 -p omw

      - name: The driver's own tests
        run: python -m unittest discover -s tools/omw/tests -t tools

      - name: The workflows, audited
        # zizmor, pinned and offline. A finding is a failure.
        run: pipx run zizmor==1.30.1 --offline .

  linux:
    name: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/openmw-deps

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          # No key may begin another: the action restores the newest cache whose name begins with the
          # key, so `linux` would take `linux-clang`'s.
          key: linux-gcc
          max-size: 2000M
          # Saved on master alone, and read by every other ref: the repository's ten gigabytes hold
          # each master cache once — CI's seven, the sanitizers' two and the dependencies — and a
          # branch's own copies would evict them.
          save: ${{ github.ref == 'refs/heads/master' }}

      - name: Build every program
        run: python omw full build

      - name: Test
        run: python omw full test --without-device

      - name: Benchmarks, run once each as upstream runs them
        working-directory: build-full
        run: |
          ./openmw_detournavigator_navmeshtilescache_benchmark
          ./openmw_esm_refid_benchmark
          ./openmw_settings_access_benchmark

      - name: Install
        run: cmake --install build-full --prefix "$RUNNER_TEMP/install"

      - name: Integration tests
        # Upstream's, from its GitLab pipeline, on the example suite at the revision it pins. The ray
        # tracer is off by default, so this runs the OpenGL renderer. No crash dialog: under Xvfb it
        # would wait for a click forever.
        env:
          EXAMPLE_SUITE_REVISION: a1ba6fc9d7315c2158ef4c60349fc4e71b7ca343
          OPENMW_CRASH_DIALOG: "0"
        run: |
          sudo apt-get install -y xvfb git-lfs
          git init -q example-suite
          git -C example-suite remote add origin https://gitlab.com/OpenMW/example-suite.git
          git -C example-suite fetch -q --depth=1 origin "$EXAMPLE_SUITE_REVISION"
          git -C example-suite checkout -q FETCH_HEAD
          suite="$GITHUB_WORKSPACE/example-suite"
          python omw full exec xvfb-run --auto-servernum --server-args='-screen 0 640x480x24x60' \
            python3 "$GITHUB_WORKSPACE/scripts/integration_tests.py" \
              --verbose \
              --omw ./openmw \
              --workdir "$GITHUB_WORKSPACE/integration_tests_output" \
              --config "$suite" \
              --data "$suite/game_template/data" \
              --data "$suite/example_animated_creature/data" \
              --data "$suite/the_hub/data" \
              --data "$suite/integration_tests/data" \
              --data "$suite/example_static_props/data" \
              "$GITHUB_WORKSPACE/scripts/data/integration_tests"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-linux-${{ github.sha }}
          # The crash matrix keeps each mode's reports in the build, which go with the runner.
          path: |
            build-full/CMakeCache.txt
            build-full/**/*.log
            build-full/crash-matrix/
            integration_tests_output/**/*.log
            integration_tests_output/**/*.cfg

  linux-clang:
    name: linux-clang
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/openmw-deps

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: linux-clang
          max-size: 1000M
          # Saved on master alone, and read by every other ref: the repository's ten gigabytes hold
          # each master cache once — CI's seven, the sanitizers' two and the dependencies — and a
          # branch's own copies would evict them.
          save: ${{ github.ref == 'refs/heads/master' }}

      - name: Build every program
        # Compiled and not run, for Clang's warnings.
        run: python omw full build

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-linux-clang-${{ github.sha }}
          path: |
            build-full/CMakeCache.txt
            build-full/**/*.log

  windows:
    name: windows
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 180
    defaults:
      run:
        # Git Bash, so every `run` is the one script on both systems.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/openmw-deps

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: windows-msvc
          # Three gigabytes: at two, every program's objects, SDL's own among them, filled the cache
          # and a run hit nothing.
          max-size: 3000M
          # Saved on master alone, and read by every other ref: the repository's ten gigabytes hold
          # each master cache once — CI's seven, the sanitizers' two and the dependencies — and a
          # branch's own copies would evict them.
          save: ${{ github.ref == 'refs/heads/master' }}

      - name: Build every program
        run: python omw full build

      - name: Test
        run: python omw full test --without-device

      - name: Benchmarks, run once each as upstream runs them
        working-directory: build-full
        run: |
          ./openmw_detournavigator_navmeshtilescache_benchmark.exe
          ./openmw_esm_refid_benchmark.exe
          ./openmw_settings_access_benchmark.exe

      - name: Install
        run: cmake --install build-full --prefix "$RUNNER_TEMP/install"

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-windows-${{ github.sha }}
          path: |
            build-full/CMakeCache.txt
            build-full/**/*.log
            build-full/crash-matrix/

  macos:
    name: macos
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 150
    env:
      CMAKE_BUILD_TYPE: RelWithDebInfo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependencies
        run: CI/before_install.macos.sh

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: macos
          max-size: 1000M
          # Saved on master alone, and read by every other ref: the repository's ten gigabytes hold
          # each master cache once — CI's seven, the sanitizers' two and the dependencies — and a
          # branch's own copies would evict them.
          save: ${{ github.ref == 'refs/heads/master' }}

      - name: Configure
        run: CI/before_script.macos.sh -C

      - name: Build
        run: CI/macos/build.sh
