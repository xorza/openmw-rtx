# The fork's CI, through the `omw` driver the desk uses; a release runs it again on its tag
# (`rtx-release.yml`). Linux and Windows, the systems the fork builds. No hosted runner has a GPU, so
# `rtx-gpu-tests` and the gate stay on a box with a card.
#
# Linux builds in AlmaLinux 8, the release's base and the vcpkg set's (`env/release-base.Dockerfile`,
# `env/install_almalinux_deps.sh`), with the pinned Clang 23 over gcc-toolset-15's libstdc++, which the set
# and every desk build with too (`vcpkg/linux.cmake`), so CI builds, tests and ships in one environment. An
# AppImage runs on no system older than its own.
#
# Job names are the `master` ruleset's required checks: a renamed job is a check that never reports.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      cache:
        description: Whether to restore and save the build caches; false for a release.
        type: boolean
        required: true

permissions: {}

# No cache for a release, which is judged by what its own run built. `format` reads an absent input
# as an empty string, where a comparison with `false` would read it as false.
env:
  CI_CACHE: ${{ format('{0}', inputs.cache) != 'false' }}

# A push cancels its branch's run before it, master's too: the latest commit alone is checked (`docs/build.md`). A run
# by hand stands alone: a push must neither cancel it nor be cancelled by it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # clang-format is the driver's pinned one, which `omw format` fetches.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Through the driver, which the gate runs too, so a tree the gate passes passes here.
      - name: File names and header guards
        run: python omw lint names pragmas

      - name: clang-format and gersemi
        run: python omw format --check

      - name: The driver, linted and type-checked
        run: python omw lint driver

      - name: The driver's own tests
        run: python -m unittest discover -s tools/omw/tests -t tools

      - name: The workflows, audited
        run: python omw lint workflows

  # The tree held to `.clang-tidy`, as the gate holds it (`omw tidy`), on each system CI builds: Windows compiles files
  # Linux does not, and MSVC reads the same source otherwise (an enum's type, an iterator that is a class, an attribute
  # its ABI ignores). A job of its own, so a finding is a check of its own. Each leg reads its build leg's caches and
  # never writes them: its own compiler cache would be the same objects twice over the repository's 10 GB. What it
  # keeps is its tidy cache, saved on master alone, so a branch lints only the sources whose reads its change moved
  # (`tidycache.py`).
  tidy:
    name: tidy-${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    permissions:
      contents: read
    # A store with nothing in it lints every source: a clang-tidy port that moved or a `.clang-tidy` changed is that.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        # Each leg a build leg's: its caches, and its system and compiler cache size as the `build` matrix names them.
        include:
          - build: linux-clang
            os: ubuntu-26.04
            container: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
            ccache-size: 2000M
          - build: windows-msvc
            os: windows-2025-vs2026
            ccache-size: 3500M
    defaults:
      run:
        shell: bash
    steps:
      - name: Git
        if: matrix.container != ''
        run: |
          dnf install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/openmw-deps
        with:
          cache: ${{ env.CI_CACHE }}
          cache-key: ${{ matrix.build }}
          ccache-size: ${{ matrix.ccache-size }}
          save: "false"

      # The newest store master saved: its entries hold where every read is as it was.
      - name: The tidy cache, restored
        if: env.CI_CACHE == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/debug/tidy-clean.json
          key: tidy-clean-${{ matrix.build }}-${{ github.sha }}
          restore-keys: tidy-clean-${{ matrix.build }}-

      - name: clang-tidy
        run: python omw tidy

      # After findings too, and after a cancel: the store holds the sources that came out clean, and only those, and
      # `omw tidy` writes it as it goes, so a run a newer push cancelled hands the next what it got through.
      - name: The tidy cache, saved
        if: ${{ always() && env.CI_CACHE == 'true' && github.ref == 'refs/heads/master' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: out/debug/tidy-clean.json
          key: tidy-clean-${{ matrix.build }}-${{ github.sha }}

  build:
    # A leg's name is also its caches' key, and no key may begin another: the compiler cache's action
    # restores the newest cache whose name begins with the key.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The Linux legs' system, stock: none for Windows, which runs on the runner itself.
    container: ${{ matrix.container }}
    permissions:
      contents: read
      actions: write # the leg's old compiler cache deleted on master, the last step
    # A cold build, which a release always is, takes an hour and a half.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-clang
            os: ubuntu-26.04
            container: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
            flavour: debug
            ccache-size: 2000M
          - name: windows-msvc
            os: windows-2025-vs2026
            flavour: debug
            # At two gigabytes the objects filled the cache and a run hit nothing; at three, one build's 2221 filled it
            # to 99.96% and a cleanup a run evicted what the next would hit. Each holds its debug information (`/Z7`).
            ccache-size: 3500M
          # ThreadSanitizer cannot share a build with AddressSanitizer. No GPU binary: under a
          # sanitizer it would never start here.
          - name: linux-asan
            os: ubuntu-26.04
            container: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
            flavour: asan
            build-flags: --without-device
            # At one gigabyte the sanitized objects evicted 335 times a run; at two, one build's came to 1.8 GB.
            ccache-size: 2500M
          - name: linux-tsan
            os: ubuntu-26.04
            # On the runner itself, over Ubuntu's GCC 15's libstdc++, against the same set: ThreadSanitizer
            # turns address randomisation off through `personality`, which Docker's seccomp profile refuses
            # ("unexpected memory mapping" in the container).
            flavour: tsan
            build-flags: --without-device
            # Its objects come to 0.3 GB, where the other Linux legs' come to 1.6 and 1.8.
            ccache-size: 500M
    defaults:
      run:
        # Git Bash on Windows, so every `run` is one script on every system.
        shell: bash
    env:
      # Read from the environment, never spliced into a script.
      FLAVOUR: ${{ matrix.flavour }}
      BUILD_FLAGS: ${{ matrix.build-flags }}
    steps:
      # The checkout needs Git in the container before it can run, and Git a repository it was not
      # handed by its owner.
      - name: Git
        if: matrix.container != ''
        run: |
          dnf install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/openmw-deps
        id: deps
        with:
          cache: ${{ env.CI_CACHE }}
          cache-key: ${{ matrix.name }}
          ccache-size: ${{ matrix.ccache-size }}

      - name: Build
        # Unquoted, so no flags pass no argument.
        run: python omw "$FLAVOUR" build $BUILD_FLAGS

      # With the vcpkg set's Qt, whose `lrelease` compiles these files: a leg that holds the set, once.
      - name: Qt translations
        if: matrix.name == 'linux-clang'
        run: python omw lint translations

      - name: Test
        # As a user where the container's steps run as root: a report folder root may always write, and a
        # device root may replace, test nothing of the cases that refuse them, as a player meets them.
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            useradd --create-home tester
            chown -R tester "$GITHUB_WORKSPACE"
            runuser -u tester -- python omw "$FLAVOUR" test --without-device
          else
            python omw "$FLAVOUR" test --without-device
          fi

      - name: Install
        if: matrix.flavour == 'debug'
        run: python omw debug exec cmake --install . --prefix "$RUNNER_TEMP/install"

      - name: Integration tests
        # Over the null backend in SDL's offscreen window: no device and no display. A pass takes a
        # minute.
        if: matrix.flavour == 'debug' && runner.os == 'Linux'
        timeout-minutes: 10
        env:
          OPENMW_RTX_BACKEND: "null"
          SDL_VIDEO_DRIVER: offscreen
        run: python omw debug integration

      - name: Logs
        if: failure()
        uses: $/.github/actions/logs
        with:
          name: logs-${{ matrix.name }}-${{ github.sha }}
          build: out/${{ matrix.flavour }}
          more: out/${{ matrix.flavour }}/integration_tests_output/**/*.cfg

      # **A leg's compiler cache stands in one copy**: the one it restored is deleted as the job ends, and the ccache
      # action's save, which runs after every step, puts the new one in its place. Saved beside it, the new copy took
      # the repository past its 10 GB until the run ended, and eviction took a live cache of another leg's. Only where
      # the action stands to save (`compiler-cache-saved`), and not after a cancel, which a push to master makes of the
      # run before it: the old copy stays where no save may follow.
      - name: The compiler cache's old copy, deleted
        if: ${{ !cancelled() && steps.deps.outputs.compiler-cache-saved == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          LEG: ${{ matrix.name }}
        run: python omw caches --ref=refs/heads/master --keep=0 "ccache-$LEG-"

  # **Each cache's newest copy alone stays**: a tools' or an archives' key a pin moved, and a tidy store a later
  # commit's replaced, each stood in the repository's 10 GB until eviction took a live one. The compiler caches are
  # each leg's own to replace, and named here only for a leg whose deletion did not run; `deps.yml` keeps its sets'.
  caches:
    name: caches
    needs: [tidy, build]
    if: ${{ always() && github.ref == 'refs/heads/master' && format('{0}', inputs.cache) != 'false' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      actions: write # the superseded caches deleted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 omw caches --ref=refs/heads/master --keep=1 ccache- tools- fetchcontent- tidy-clean-
