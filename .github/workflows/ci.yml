# All of the fork's CI, through the same `omw` driver the desk uses.
#
# `omw full` builds every program and runs every suite: on Ubuntu with GCC, with Clang (built, not
# run), and on Windows with MSVC. macOS is compiled only: no device there traces rays, and `hdiutil`
# fails on the runner's own "Resource busy". Upstream's GitLab checks run here too: the source checks,
# warnings as errors, and its integration tests over the ray tracer's null backend. No hosted runner
# has a GPU, so `rtx-gpu-tests` is left out and the gate stays on a box with a card.
#
# **Each system on its newest image, Linux apart**: Ubuntu 24.04 is the base the AppImage is built on,
# and an AppImage runs on no system older than its own, so CI tests the base the package ships from.
#
# **Job names are the `master` ruleset's required checks**, the build legs' by their `name` in the
# matrix: rename one and the ruleset waits for a check that never reports. Actions are pinned to a
# commit, the token only reads, and a newer push cancels the run it supersedes.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # A release runs the whole of CI again on the commit its tag names (`rtx-release.yml`).
  workflow_call:
    inputs:
      cache:
        description: Whether to restore and save the build caches; false for a release.
        type: boolean
        required: true

# Nothing by default, and each job names what it needs.
permissions: {}

# **The caches on every run but a release's**, which is judged by what its own run built and not by
# objects another run left. `inputs` is empty on a push or a pull request, and `format` reads it as
# an empty string where a comparison with `false` would read it as false.
env:
  CI_CACHE: ${{ format('{0}', inputs.cache) != 'false' }}

# A push supersedes the push before it on the same ref. A run asked for by hand stands alone: it is
# wanted whole, and a push in the meantime must neither cancel it nor be cancelled by it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: clang-format 14, the version upstream pins, and Qt's lupdate
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14 qt6-l10n-tools

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # **Each check through the driver, which the gate runs too**, so a tree the gate passes is one
      # this job passes: `omw lint` holds the rules and the tools' pins.
      - name: CMake files indented with spaces
        run: python omw lint cmake

      - name: File names
        run: python omw lint names

      - name: Qt translations
        # Upstream's own check: the translation sources are regenerated and must not change.
        run: LUPDATE=/usr/lib/qt6/bin/lupdate python omw lint translations

      - name: clang-format
        # The driver's own check, and the one in CI: the build jobs leave the formatting to this one.
        run: python omw format --check

      - name: The driver, linted and type-checked
        # Ruff's default rules at the tree's 120 columns, and mypy, both against the oldest Python
        # `omw` supports.
        run: python omw lint driver

      - name: The driver's own tests
        run: python -m unittest discover -s tools/omw/tests -t tools

      - name: The workflows, audited
        # zizmor, offline. A finding is a failure.
        run: python omw lint workflows

  build:
    # One leg per toolchain, each reporting under its own name, which the ruleset requires.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 180
    # Each toolchain finds what the others cannot, so one failing says nothing about the others.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-24.04
            # No key may begin another: the cache action restores the newest cache whose name begins
            # with the key, so `linux` would take `linux-clang`'s.
            ccache: linux-gcc
            ccache-size: 2000M
            tested: true
          - name: linux-clang
            os: ubuntu-24.04
            ccache: linux-clang
            ccache-size: 1000M
            # Compiled and not run, for Clang's warnings.
            tested: false
            cc: clang
            cxx: clang++
          - name: windows
            os: windows-2025
            ccache: windows-msvc
            # Three gigabytes: at two, every program's objects, SDL's own among them, filled the cache
            # and a run hit nothing.
            ccache-size: 3000M
            tested: true
    defaults:
      run:
        # Git Bash on Windows, so every `run` is the one script on every system.
        shell: bash
    env:
      # Empty on the legs that take the system's compiler, which CMake reads as unset.
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/openmw-deps
        with:
          cache: ${{ env.CI_CACHE }}
          ccache-key: ${{ matrix.ccache }}
          ccache-size: ${{ matrix.ccache-size }}

      - name: Build every program
        run: python omw full build

      - name: Test
        if: matrix.tested
        run: python omw full test --without-device

      - name: Benchmarks, run once each as upstream runs them
        if: matrix.tested
        working-directory: build-full
        # Without `.exe`, which Git Bash finds on its own.
        run: |
          ./openmw_detournavigator_navmeshtilescache_benchmark
          ./openmw_esm_refid_benchmark
          ./openmw_settings_access_benchmark

      - name: Install
        if: matrix.tested
        run: cmake --install build-full --prefix "$RUNNER_TEMP/install"

      - name: Integration tests
        # Upstream's, from its GitLab pipeline, on the example suite at the revision it pins: the ray
        # tracer's game side whole over the null backend, which draws nothing and needs no device,
        # in a window of SDL's offscreen driver, which needs no display. Their logs are under the
        # build, which the logs step keeps. A pass takes about a minute, and the limit ends a run
        # that hangs.
        if: matrix.tested && runner.os == 'Linux'
        timeout-minutes: 10
        env:
          OPENMW_RTX_BACKEND: "null"
          SDL_VIDEO_DRIVER: offscreen
        run: python omw full integration --verbose

      - name: Logs
        if: failure()
        uses: $/.github/actions/logs
        with:
          name: logs-${{ matrix.name }}-${{ github.sha }}
          build: build-full
          # The settings each integration suite ran under, beside its log, which the build's keeps.
          more: build-full/integration_tests_output/**/*.cfg

  macos:
    name: macos
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 150
    env:
      CMAKE_BUILD_TYPE: RelWithDebInfo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dependencies
        run: CI/before_install.macos.sh

      # Its own, as macOS takes nothing of `openmw-deps`; saved on master alone, for the reason that
      # action gives.
      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        if: env.CI_CACHE == 'true'
        with:
          key: macos
          max-size: 1000M
          save: ${{ github.ref == 'refs/heads/master' }}

      - name: Configure
        run: CI/before_script.macos.sh -C

      - name: Build
        run: CI/macos/build.sh

      - name: The bundle carries none of the harness
        # The bundle is installed whole, so the harness's folder and its executable stand beside it
        # in the build tree (`RTX_HARNESS_DIR`, `apps/rtxtool`'s output directory), and the GPU tests'
        # with them. The renderer's own shaders are looked for first, and the harness beside the
        # bundle, so a build that moved either fails here rather than passing a search of nothing.
        # What the harness is, is the packages' own list (`HARNESS_NAMES` in `tools/omw/package.py`).
        run: |
          bundle=build/OpenMW.app
          test -d "$bundle/Contents/Resources/resources/rtx/shaders"
          test -x build/openmw-rtxtool
          build/openmw-rtxtool --help > /dev/null
          found=$(PYTHONPATH=tools python3 -c 'import sys; from pathlib import Path; from omw.package import harness_files; print(" ".join(harness_files(Path(sys.argv[1]))))' "$bundle")
          if [ -n "$found" ]; then
            echo "::error::the bundle carries the harness's files: $found"
            exit 1
          fi
