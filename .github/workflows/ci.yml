# The fork's CI, through the `omw` driver the desk uses; a release runs it again on its tag
# (`rtx-release.yml`). Linux and Windows, the systems the fork builds. No hosted runner has a GPU, so
# `rtx-gpu-tests` and the gate stay on a box with a card.
#
# Linux builds in AlmaLinux 8 with gcc-toolset-15, the release's base and the vcpkg set's
# (`env/release-base.Dockerfile`, `env/install_almalinux_deps.sh`), so CI builds, tests and ships in one
# environment. An AppImage runs on no system older than its own.
#
# Job names are the `master` ruleset's required checks: a renamed job is a check that never reports.
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      cache:
        description: Whether to restore and save the build caches; false for a release.
        type: boolean
        required: true

permissions: {}

# No cache for a release, which is judged by what its own run built. `format` reads an absent input
# as an empty string, where a comparison with `false` would read it as false.
env:
  CI_CACHE: ${{ format('{0}', inputs.cache) != 'false' }}

# A run by hand stands alone: a push must neither cancel it nor be cancelled by it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # clang-format is the driver's pinned one, which `omw format` fetches.
      - name: Qt's lupdate
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Through the driver, which the gate runs too, so a tree the gate passes passes here.
      - name: File names
        run: python omw lint names

      - name: Qt translations
        run: LUPDATE=/usr/lib/qt6/bin/lupdate python omw lint translations

      - name: clang-format and gersemi
        run: python omw format --check

      - name: The driver, linted and type-checked
        run: python omw lint driver

      - name: The driver's own tests
        run: python -m unittest discover -s tools/omw/tests -t tools

      - name: The workflows, audited
        run: python omw lint workflows

  build:
    # A leg's name is also its caches' key, and no key may begin another: the compiler cache's action
    # restores the newest cache whose name begins with the key.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # The Linux legs' system, stock: none for Windows, which runs on the runner itself.
    container: ${{ matrix.container }}
    permissions:
      contents: read
    # A cold build, which a release always is, takes an hour and a half.
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc
            os: ubuntu-26.04
            container: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
            flavour: debug
            ccache-size: 2000M
            tested: true
          - name: linux-clang
            os: ubuntu-26.04
            container: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
            flavour: debug
            ccache-size: 1000M
            # Compiled for Clang's warnings, not run, with the Clang the editor's clangd is.
            tested: false
            clang: true
          - name: windows-msvc
            os: windows-2025-vs2026
            flavour: debug
            # At two gigabytes the objects filled the cache and a run hit nothing.
            ccache-size: 3000M
            tested: true
          # ThreadSanitizer cannot share a build with AddressSanitizer. No GPU binary: under a
          # sanitizer it would never start here.
          - name: linux-asan
            os: ubuntu-26.04
            container: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
            flavour: asan
            build-flags: --without-device
            # At one gigabyte the sanitized objects evicted 335 times a run.
            ccache-size: 2000M
            tested: true
          - name: linux-tsan
            os: ubuntu-26.04
            # On the runner itself, with Ubuntu's GCC 15, against the same set: ThreadSanitizer turns address
            # randomisation off for its process through `personality`, which Docker's seccomp profile refuses,
            # and every sanitized program stopped on "unexpected memory mapping" in the container.
            flavour: tsan
            build-flags: --without-device
            ccache-size: 2000M
            tested: true
    defaults:
      run:
        # Git Bash on Windows, so every `run` is one script on every system.
        shell: bash
    env:
      # Read from the environment, never spliced into a script.
      FLAVOUR: ${{ matrix.flavour }}
      BUILD_FLAGS: ${{ matrix.build-flags }}
    steps:
      # The checkout needs Git in the container before it can run, and Git a repository it was not
      # handed by its owner.
      - name: Git
        if: matrix.container != ''
        run: |
          dnf install -y git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/openmw-deps
        with:
          cache: ${{ env.CI_CACHE }}
          cache-key: ${{ matrix.name }}
          ccache-size: ${{ matrix.ccache-size }}

      # kernel.org's build of LLVM, pinned (`deps.llvm`): AlmaLinux 8 carries no Clang 23. Told where
      # gcc-toolset-15's libstdc++ is by the configuration file Clang reads beside itself, as it finds the
      # system's GCC 8 on its own, which has no static libstdc++.
      - name: Clang 23
        if: matrix.clang
        run: |
          llvm="$(python -c 'import sys; sys.path.insert(0, "tools"); from omw import deps; print(deps.llvm())')"
          for driver in clang clang++; do
            echo "--gcc-install-dir=/opt/rh/gcc-toolset-15/root/usr/lib/gcc/x86_64-redhat-linux/15" > "$llvm/bin/$driver.cfg"
          done
          echo "CC=$llvm/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=$llvm/bin/clang++" >> "$GITHUB_ENV"

      - name: Build
        # Unquoted, so no flags pass no argument.
        run: python omw "$FLAVOUR" build $BUILD_FLAGS

      - name: Test
        if: matrix.tested
        # As a user where the container's steps run as root: a report folder root may always write, and a
        # device root may replace, test nothing of the cases that refuse them, as a player meets them.
        run: |
          if [ "$(id -u)" -eq 0 ]; then
            useradd --create-home tester
            chown -R tester "$GITHUB_WORKSPACE"
            runuser -u tester -- python omw "$FLAVOUR" test --without-device
          else
            python omw "$FLAVOUR" test --without-device
          fi

      - name: Benchmarks, run once each as upstream runs them
        if: matrix.tested && matrix.flavour == 'debug'
        working-directory: build-debug
        # Without `.exe`, which Git Bash finds on its own.
        run: |
          ./openmw_detournavigator_navmeshtilescache_benchmark
          ./openmw_esm_refid_benchmark
          ./openmw_settings_access_benchmark

      - name: Install
        if: matrix.tested && matrix.flavour == 'debug'
        run: python omw debug exec cmake --install . --prefix "$RUNNER_TEMP/install"

      - name: Integration tests
        # Over the null backend in SDL's offscreen window: no device and no display. A pass takes a
        # minute.
        if: matrix.tested && matrix.flavour == 'debug' && runner.os == 'Linux'
        timeout-minutes: 10
        env:
          OPENMW_RTX_BACKEND: "null"
          SDL_VIDEO_DRIVER: offscreen
        run: python omw debug integration --verbose

      - name: Logs
        if: failure()
        uses: $/.github/actions/logs
        with:
          name: logs-${{ matrix.name }}-${{ github.sha }}
          build: build-${{ matrix.flavour }}
          more: build-${{ matrix.flavour }}/integration_tests_output/**/*.cfg
