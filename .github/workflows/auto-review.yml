# An automatic first reader of every pull request and issue, ahead of the maintainer, who reads each after it: a
# pull request gets a review by `.github/review/passes.md` and `.github/auto-review/pull-request.md`, judged and never
# fixed, as one comment-only review; an issue gets a first investigation by `.github/auto-review/issue.md`, as one
# comment. Each says it is automatic and that a maintainer will follow, names no tool, and asks for a 👍 or 👎.
#
# **The agent never holds a write**, as GitHub's agentic workflows' safe outputs and `upstream.yml` hold theirs:
# `auto-review-item.yml` gathers the item as data with no secret, an agent reads it under `upstream.yml`'s cage with
# a read token and answers structured output, and a job that runs no agent posts it through `omw review post`, which
# makes the text inert and searches it for the agent's credential first. Refused: the action's own review and
# triage recipes, whose agent posts with the repository's token — the PromptPwnd class. The agent searches and
# fetches the web freely, and a posted link may name any host over HTTPS: the review cites papers, specifications
# and other engines wherever they are, and the agent holds nothing a fetch could carry away. Refused: a list of
# hosts, which redacted the citations the review is for.
#
# **The agent runs under `workflow_dispatch` or `schedule`, never under the item's own event**: the action checks
# the actor's write access on an item's events and skips it on these two, so a stranger's pull request would be
# refused under its own. Refused: `allowed_non_write_users: "*"`, which the action's security guide calls a
# significant risk. What makes a stranger's text safe here is the cage, not the actor.
#
# **Two routes, one pipeline.** A new item is dispatched within minutes by `notice`, which checks out nothing and
# runs nothing of the item's: GitHub Security Lab's split of an unprivileged trigger from a privileged run, with a
# dispatch, the one event a `GITHUB_TOKEN` may start a run with. An hourly sweep reads what is due since: a pull
# request's later head once it has stood 5 hours, so a day of pushes is one review, and anything a dispatch missed.
# Both pick by `omw review survey`, and the item workflow's read and post each stop where an answer stands at that
# head, so the two routes never answer one item twice. What the workflow posts starts no run, so it cannot answer
# itself. `gh workflow disable auto-review.yml` stops it all.
#
# **Every read is bounded** (`omw review survey`'s `Limits`): an author's 3 and the repository's 20 in any 24 hours,
# the sliding window of GitHub's agentic workflows' `user-rate-limit`; 8 a run; 5 a pull request and one more when it
# turns ready; 2 a head that posted nothing. Counted from this workflow's run history, never stored; an item over a
# limit waits and is never dropped. Read: every pull request and issue but the owner's and the bots', drafts
# included; an issue once, again only when the maintainer dispatches it with `again`.
name: Auto review

on:
    schedule:
        # Off the top of the hour, when GitHub's scheduler is busiest.
        - cron: "17 * * * *"
    workflow_dispatch:
        inputs:
            item:
                description: "`pr:<number>` or `issue:<number>`; empty reads every open item that is due."
                type: string
                required: false
            again:
                description: Read the item again though it was answered.
                type: boolean
                default: false
            dry_run:
                description: Write each answer to the run's summary instead of posting it.
                type: boolean
                default: false
    pull_request_target: # zizmor: ignore[dangerous-triggers] `notice` checks out nothing and runs nothing of the pull request's: it dispatches this workflow by the number
        types: [opened, reopened, ready_for_review]
    issues:
        types: [opened, reopened]

permissions: {}

jobs:
    notice:
        if: github.event_name == 'pull_request_target' || github.event_name == 'issues'
        runs-on: ubuntu-26.04
        timeout-minutes: 5
        permissions:
            actions: write
        steps:
            - name: The item's read, dispatched
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  ITEM: ${{ github.event_name == 'issues' && format('issue:{0}', github.event.issue.number) || format('pr:{0}', github.event.pull_request.number) }}
              run: gh workflow run auto-review.yml --ref master -f item="$ITEM"

    survey:
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        permissions:
            contents: read
            issues: read
            pull-requests: read
            actions: read
        outputs:
            items: ${{ steps.survey.outputs.items }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
              with:
                  python-version: "3.11"

            - name: What is due
              id: survey
              env:
                  GH_TOKEN: ${{ github.token }}
                  ITEM: ${{ inputs.item }}
                  AGAIN: ${{ inputs.again == true }}
              shell: bash
              run: |
                  args=()
                  if [ -n "$ITEM" ]; then
                    args+=(--item "$ITEM")
                  fi
                  if [ "$AGAIN" = true ]; then
                    args+=(--again)
                  fi
                  python omw review survey "${args[@]}"

    items:
        needs: survey
        if: needs.survey.outputs.items != '' && needs.survey.outputs.items != '[]'
        name: ${{ matrix.item.name }}
        strategy:
            fail-fast: false
            matrix:
                item: ${{ fromJSON(needs.survey.outputs.items) }}
        permissions:
            contents: read
            issues: write
            pull-requests: write
        uses: $/.github/workflows/auto-review-item.yml
        with:
            item: ${{ matrix.item.item }}
            slug: ${{ matrix.item.slug }}
            again: ${{ inputs.again == true }}
            dry_run: ${{ inputs.dry_run == true }}
        secrets:
            CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
