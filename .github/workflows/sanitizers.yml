# The tests under the sanitizers, called by `daily.yml` every day and by `rtx-release.yml` before a
# release is made, and started by hand for a branch.
#
# The sanitizers are upstream's, from its GitLab pipeline: AddressSanitizer and
# UndefinedBehaviorSanitizer over its suites, with a finding a failure. Here the fork's `asan` flavour,
# which carries both, over upstream's suites and the fork's own, without a device as every hosted run
# is. Linux alone, because the flavour is: the Windows archive a release ships is not sanitized.
name: Sanitizers

on:
  workflow_call:
    inputs:
      cache:
        description: Whether to restore and save the build caches; false for a release.
        type: boolean
        required: true
  # By hand, for a branch that wants its sanitizers read before the daily run reaches it: the daily
  # run is the default branch's alone, and it files an issue where this only fails.
  workflow_dispatch:
    inputs:
      cache:
        description: Whether to restore and save the build caches.
        type: boolean
        default: true

# Nothing by default, and each job names what it needs.
permissions: {}

jobs:
  sanitizers:
    name: sanitizers
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A cold build is an hour and a half, which is what a release, with no cache, always has.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    env:
      # A filter that matches nothing is a failure and not a pass, on a Google Test that reads this;
      # an older one ignores it. Here and not in the callers, whose `env` a called workflow does not see.
      GTEST_FAIL_IF_NO_TEST_SELECTED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/openmw-deps
        with:
          cache: ${{ inputs.cache }}

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        # **No cache for a release**: what it is judged by is built from what its own run fetched, and
        # not from objects another run left where this one reads them.
        if: inputs.cache
        with:
          # Two gigabytes: at one, the sanitized objects of every suite (`--all`) filled the cache
          # and evicted 335 times over a run.
          key: sanitizers
          max-size: 2000M

      - name: Build
        run: python omw asan build

      - name: Test, upstream's suites whole beside the fork's, in a shuffled order
        # Shuffled, so a test that leans on what an earlier one left behind fails here: the seed is in
        # a failing test's log, and `--gtest_random_seed` takes it back. A test that captured stderr
        # and never gave it back broke every later death test in its binary, and ran in upstream's
        # order for years. Google Test reads its flags from the environment as well as the line.
        env:
          GTEST_SHUFFLE: "1"
        run: python omw asan test --without-device --all

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs-sanitizers-${{ github.sha }}
          path: |
            build-asan/CMakeCache.txt
            build-asan/**/*.log
            build-asan/crash-matrix/
