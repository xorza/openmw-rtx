# The tests under the sanitizers, called by `daily.yml` every day and by `rtx-release.yml` before a
# release is made, and started by hand for a branch.
#
# The sanitizers are upstream's, from its GitLab pipeline: AddressSanitizer and
# UndefinedBehaviorSanitizer over its suites, with a finding a failure. Here the fork's `asan` flavour,
# which carries both, over upstream's suites and the fork's own, without a device as every hosted run
# is. **And ThreadSanitizer beside them**, the `tsan` flavour, for the threads the fork keeps — the
# cell reader, the workers, the harness's instruments — and a build of its own, because it cannot share
# one with AddressSanitizer. Linux alone, because both flavours are: the Windows archive a release
# ships is not sanitized.
name: Sanitizers

on:
  workflow_call:
    inputs:
      cache:
        description: Whether to restore and save the build caches; false for a release.
        type: boolean
        required: true
  # By hand, for a branch that wants its sanitizers read before the daily run reaches it: the daily
  # run is the default branch's alone, and it files an issue where this only fails.
  workflow_dispatch:
    inputs:
      cache:
        description: Whether to restore and save the build caches.
        type: boolean
        default: true

# Nothing by default, and each job names what it needs.
permissions: {}

jobs:
  sanitizers:
    name: sanitizers (${{ matrix.flavour }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    # A cold build is an hour and a half, which is what a release, with no cache, always has.
    timeout-minutes: 180
    # Each sanitizer finds what the other cannot, so one failing says nothing about the other.
    strategy:
      fail-fast: false
      matrix:
        flavour: [asan, tsan]
    defaults:
      run:
        shell: bash
    env:
      # Read by the steps from the environment, never spliced into their scripts.
      FLAVOUR: ${{ matrix.flavour }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # **No cache for a release**: what it is judged by is built from what its own run fetched, and
      # not from objects another run left where this one reads them.
      - uses: $/.github/actions/openmw-deps
        with:
          cache: ${{ inputs.cache }}
          ccache-key: sanitizers-${{ matrix.flavour }}
          # Two gigabytes: at one, the sanitized objects of every suite filled the cache and evicted
          # 335 times over a run.
          ccache-size: 2000M

      - name: Build
        # What the run below runs and nothing it leaves out: the GPU binary, built under a
        # sanitizer, would never start here.
        run: python omw "$FLAVOUR" build --without-device

      - name: Test
        # Shuffled, as every suite is: the test preset sets `GTEST_SHUFFLE`.
        run: python omw "$FLAVOUR" test --without-device

      - name: Logs
        if: failure()
        uses: $/.github/actions/logs
        with:
          name: logs-sanitizers-${{ matrix.flavour }}-${{ github.sha }}
          build: build-${{ matrix.flavour }}
