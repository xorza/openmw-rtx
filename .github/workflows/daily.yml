# What is too slow for every push and too important to leave to a tag, once a day: the tests under
# the sanitizers, and the packaging, so the archive a release takes does not decay between releases.
#
# **A failure is an issue, and a pass after it closes the issue.** Nobody reads a scheduled run that
# nobody started, so the last job opens one issue labelled `daily-ci` where any job failed, comments
# on it where one is already open, and comments and closes it on the first run that passes again. One
# issue for one breakage however many days it lasts, and never an issue for a run that was only
# cancelled.
#
# The sanitizers are `sanitizers.yml`, which a release runs as well, here with the caches. The
# packaging is `omw archive`, which a release runs, on both systems.
name: Daily

on:
  schedule:
    # Every day at 03:00 UTC, ahead of the upstream merge at 05:00, so a merge lands on a tree whose
    # daily state is known. GitHub runs a schedule from the default branch alone, and late under load.
    - cron: "0 3 * * *"
  workflow_dispatch:

# Nothing by default, and each job names what it needs.
permissions: {}

# A run is never cancelled, since it is the day's answer; one asked for by hand waits its turn.
concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  sanitizers:
    uses: $/.github/workflows/sanitizers.yml
    permissions:
      contents: read
    with:
      cache: true

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/openmw-deps

      # **No compiler cache**, as a release keeps none: nobody waits on a nightly, and the
      # repository's ten gigabytes are CI's and the sanitizers'.
      - name: Package, as a release does
        run: python omw archive daily

  report:
    # After both, whatever they came to, and never for a run that was cancelled: a cancelled run
    # says nothing about the tree.
    name: report
    needs: [sanitizers, package]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the daily issue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failed=$(jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")' <<< "$NEEDS")
          open=$(gh issue list --state open --label daily-ci --limit 1 --json number --jq '.[0].number // empty')

          if [ -z "$failed" ]; then
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "Passed again: $RUN_URL"
              gh issue close "$open"
            fi
            exit 0
          fi

          body="The daily run failed in: $failed. $RUN_URL"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            # Made where it is not there yet, so the first failure of a fresh fork files as well.
            gh label create daily-ci --color B60205 --description "The daily run failed" --force
            gh issue create --title "The daily run fails" --label daily-ci --body "$body"
          fi
