# **A release is a tag**: a push of `rtx-v*` builds the `package` flavour on both systems, the
# archive a player takes — an AppImage on Linux, which carries Qt, OSG, MyGUI, SDL and the Vulkan
# loader and leaves the driver to the host, and on Windows the portable folder, which is what a fork
# under a renderer nobody has installed before should be rather than an installer that registers
# itself where a stock OpenMW would — and puts both on a draft release, to be read before it is
# published. `ci.yml` has already built and tested the commit the tag names.
#
# The packaging can be tried without a tag: run this by hand, and the archives come back as
# artifacts, in the one zip GitHub wraps around each. `daily.yml` does that every day, and keeps
# nothing.
name: Release

on:
  push:
    tags: [rtx-v*]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            # An AppImage is compressed already; the Windows folder is not.
            compression: 0
          - os: windows-2022
            compression: 6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/openmw-deps

      - uses: ./.github/actions/rtx-sdks

      - uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: package-${{ matrix.os }}
          max-size: 1000M

      - name: Package
        # Named after the ref, so a tag names its archives and a run by hand names the branch.
        run: apps/rtxtool/rtx package archive "$GITHUB_REF_NAME"

      - name: Archive
        # `dist` whole, so the folder keeps its name inside the zip GitHub wraps around the artifact,
        # which is the only zip a run's page offers.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openmw-${{ github.ref_name }}-${{ matrix.os }}
          path: dist
          if-no-files-found: error
          compression-level: ${{ matrix.compression }}

  release:
    # A draft, with both archives, on the tag that was pushed. Only this job can write, and it runs
    # on nothing but a release tag; a leg that failed leaves no release at all.
    if: startsWith(github.ref, 'refs/tags/rtx-v')
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: openmw-*
          path: dist
          merge-multiple: true

      - name: Zip the Windows folder
        # A release attaches files, so the folder becomes the zip here, named after itself.
        run: |
          cd dist
          for folder in */; do
            zip -qr "${folder%/}.zip" "$folder"
            rm -r "$folder"
          done
          ls -l

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: dist/*
          fail_on_unmatched_files: true
