# **A release is a tag**: a push of `rtx-v*` builds the `package` flavour on both systems, the
# archive a player takes — an AppImage on Linux, which carries Qt, OSG, MyGUI, SDL and the Vulkan
# loader and leaves the driver to the host, and on Windows the portable folder, which is what a fork
# under a renderer nobody has installed before should be rather than an installer that registers
# itself where a stock OpenMW would — and puts both on a draft release, each with the Breakpad
# symbols `omw crash` reads a player's dump against, to be read before it is published. Beside the
# packaging, the commit the tag names is built and tested by the whole of `ci.yml`, and a failure of
# any of its jobs leaves no release. **Run here, and not taken on trust**: a tag can name any commit,
# one CI never ran on or one it failed, and a merge that auto-merge landed was checked on its pull
# request's merge ref, not on the commit master holds. The packaging runs here alone, so a commit
# that breaks it shows at the next release.
#
# The packaging can be tried without a tag: run this by hand, and the archives and the symbols come
# back as artifacts, in the one zip GitHub wraps around each.
name: Release

on:
  push:
    tags: [rtx-v*]
  workflow_dispatch:

# Nothing by default, and each job names what it needs.
permissions: {}

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      cache: false

  package:
    # `omw archive` of the `package` flavour on both systems, kept as the run's artifacts. **No cache
    # of any kind**: what a release ships is built from what this run fetched and checked, and not
    # from objects another run left where this one reads them.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-package
            os: ubuntu-24.04
            # An AppImage is compressed already; the Windows folder is not.
            compression: 0
          - name: windows-package
            os: windows-2025
            compression: 6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/openmw-deps
        with:
          cache: false

      - name: Name
        # After the ref, so a tag names its archives and a run by hand the branch: once, for the
        # archives and the artifact both, with what a ref may hold and a file may not — a `/` above
        # all, which `upload-artifact` refuses at the end of the build — as a `-`.
        run: echo "ARCHIVE_NAME=${GITHUB_REF_NAME//[\/\"<>|]/-}" >> "$GITHUB_ENV"

      - name: Package
        run: python omw archive "$ARCHIVE_NAME"

      - name: Archive
        # `dist` whole, so the folder keeps its name inside the zip GitHub wraps around the artifact,
        # which is the only zip a run's page offers.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmw-${{ env.ARCHIVE_NAME }}-${{ matrix.name }}
          path: dist
          if-no-files-found: error
          compression-level: ${{ matrix.compression }}

  release:
    # A draft, with both archives and their symbols, on the tag that was pushed. Only this job can
    # write, and it runs on nothing but a release tag; a leg that failed, CI's included, leaves no
    # release at all.
    if: startsWith(github.ref, 'refs/tags/rtx-v')
    needs: [ci, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: openmw-*
          path: dist
          merge-multiple: true

      - name: Zip the Windows folder
        # A release attaches files, so the folder becomes the zip here, named after itself.
        run: |
          cd dist
          for folder in */; do
            zip -qr "${folder%/}.zip" "$folder"
            rm -r "$folder"
          done
          ls -l

      - name: The draft release
        # `gh`, which every runner carries, rather than an action that wraps it.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" dist/*
