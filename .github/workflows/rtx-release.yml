# A push of `rtx-v*` builds the `release` flavour on both systems with link-time optimisation and puts
# the archives and their Breakpad symbols on a draft release. `ci.yml` runs whole on the tagged commit too, as a tag can
# name a commit CI never ran on, and an auto-merge was checked on its pull request's merge ref.
#
# Run by hand, it hands back the archives as artifacts and makes no release.
name: Release

on:
  push:
    tags: [rtx-v*]
  workflow_dispatch:

permissions: {}

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      cache: false

  package:
    # No cache: a release ships what this run fetched and built.
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # On the runner itself: `omw archive` builds Linux's in the release base's container, AlmaLinux 8, whose glibc
    # is the AppImage's floor, and makes the symbols outside it, as `dump_syms` asks a newer glibc.
    permissions:
      contents: read
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-package
            os: ubuntu-26.04
            # An AppImage is compressed already; the Windows folder is not.
            compression: 0
          - name: windows-package
            os: windows-2025-vs2026
            compression: 6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/openmw-deps
        with:
          cache: false

      - name: Name
        # After the ref, with what a file name may not hold as `-`: `upload-artifact` refuses a `/`.
        run: echo "ARCHIVE_NAME=${GITHUB_REF_NAME//[\/\"<>|]/-}" >> "$GITHUB_ENV"

      - name: Package
        env:
          # What ships is linked with link-time optimisation, which a desk's release build leaves off.
          OMW_LTO: "ON"
        run: python omw archive "$ARCHIVE_NAME"

      - name: Archive
        # `out/dist` whole, so the folder keeps its name inside the zip GitHub wraps around the
        # artifact.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmw-${{ env.ARCHIVE_NAME }}-${{ matrix.name }}
          path: out/dist
          if-no-files-found: error
          compression-level: ${{ matrix.compression }}

  release:
    # The only job that can write, and only on a release tag.
    if: startsWith(github.ref, 'refs/tags/rtx-v')
    needs: [ci, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: openmw-*
          path: dist
          merge-multiple: true

      - name: Zip the Windows folder
        # A release attaches files, not folders.
        run: |
          cd dist
          for folder in */; do
            zip -qr "${folder%/}.zip" "$folder"
            rm -r "$folder"
          done
          ls -l

      - name: The draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        # The libraries are linked in, the LGPL's among them: the notes say where their source is.
        run: |
          gh release create "$TAG" --draft --verify-tag --title "$TAG" dist/* --notes "Every third-party
          library is linked into the programs, built by vcpkg from the registry commit, the tool and the overlay
          ports this tag's vcpkg.json, vcpkg-configuration.json, vcpkg/ and tools/omw/pins.py name; their
          licences ship in each archive's licenses folder."
