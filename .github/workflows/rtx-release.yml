# **A release is a tag**: a push of `rtx-v*` builds the `package` flavour on both systems, the
# archive a player takes — an AppImage on Linux, which carries Qt, OSG, MyGUI, SDL and the Vulkan
# loader and leaves the driver to the host, and on Windows the portable folder, which is what a fork
# under a renderer nobody has installed before should be rather than an installer that registers
# itself where a stock OpenMW would — and puts both on a draft release, each with the Breakpad
# symbols `omw crash` reads a player's dump against, to be read before it is published. Beside the
# packaging, the commit the tag names is built and tested by the whole of `ci.yml` and again under the
# sanitizers (`sanitizers.yml`), and a failure of either leaves no release. **Run here, and not taken
# on trust**: a tag can name any commit, one CI never ran on or one it failed, and a merge that
# auto-merge landed was checked on its pull request's merge ref, not on the commit master holds.
#
# The packaging can be tried without a tag: run this by hand, and the archives and the symbols come
# back as artifacts, in the one zip GitHub wraps around each. `daily.yml` does that every day, with
# its caches, and keeps nothing.
name: Release

on:
  push:
    tags: [rtx-v*]
  workflow_dispatch:

# Nothing by default, and each job names what it needs.
permissions: {}

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      cache: false

  sanitizers:
    uses: $/.github/workflows/sanitizers.yml
    permissions:
      contents: read
    with:
      cache: false

  package:
    # **No cache of any kind**: what a release ships is built from what this run fetched and
    # checked, and not from objects another run left where this one reads them.
    uses: $/.github/workflows/package.yml
    permissions:
      contents: read
    with:
      cache: false
      keep: true

  release:
    # A draft, with both archives and their symbols, on the tag that was pushed. Only this job can
    # write, and it runs on nothing but a release tag; a leg that failed, CI's and the sanitizers'
    # included, leaves no release at all.
    if: startsWith(github.ref, 'refs/tags/rtx-v')
    needs: [ci, sanitizers, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: openmw-*
          path: dist
          merge-multiple: true

      - name: Zip the Windows folder
        # A release attaches files, so the folder becomes the zip here, named after itself.
        run: |
          cd dist
          for folder in */; do
            zip -qr "${folder%/}.zip" "$folder"
            rm -r "$folder"
          done
          ls -l

      - name: The draft release
        # `gh`, which every runner carries, rather than an action that wraps it.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" dist/*
