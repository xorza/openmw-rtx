# **A release is a tag**: a push of `rtx-v*` builds the `package` flavour on both systems, the
# archive a player takes — an AppImage on Linux, which carries Qt, OSG, MyGUI, SDL and the Vulkan
# loader and leaves the driver to the host, and on Windows the portable folder, which is what a fork
# under a renderer nobody has installed before should be rather than an installer that registers
# itself where a stock OpenMW would — and puts both on a draft release, each with the Breakpad
# symbols `omw crash` reads a player's dump against, to be read before it is published. `ci.yml` has
# already built and tested the commit the tag names; beside the packaging, the tests run again under
# the sanitizers (`sanitizers.yml`), and a finding leaves no release.
#
# The packaging can be tried without a tag: run this by hand, and the archives and the symbols come
# back as artifacts, in the one zip GitHub wraps around each. `daily.yml` does that every day, with
# its caches, and keeps nothing.
name: Release

on:
  push:
    tags: [rtx-v*]
  workflow_dispatch:

# Nothing by default, and each job names what it needs.
permissions: {}

jobs:
  sanitizers:
    uses: $/.github/workflows/sanitizers.yml
    permissions:
      contents: read
    with:
      cache: false

  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            # An AppImage is compressed already; the Windows folder is not.
            compression: 0
          - os: windows-2025
            compression: 6
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # **No cache of any kind**: what a release ships is built from what this run fetched and
      # checked, and not from objects another run left where this one reads them.
      - uses: $/.github/actions/openmw-deps
        with:
          cache: "false"

      - name: Package
        # Named after the ref, so a tag names its archives and a run by hand names the branch.
        run: python omw archive "$GITHUB_REF_NAME"

      - name: Archive
        # `dist` whole, so the folder keeps its name inside the zip GitHub wraps around the artifact,
        # which is the only zip a run's page offers.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openmw-${{ github.ref_name }}-${{ matrix.os }}
          path: dist
          if-no-files-found: error
          compression-level: ${{ matrix.compression }}

  release:
    # A draft, with both archives and their symbols, on the tag that was pushed. Only this job can
    # write, and it runs on nothing but a release tag; a leg that failed, the sanitizers' included,
    # leaves no release at all.
    if: startsWith(github.ref, 'refs/tags/rtx-v')
    needs: [sanitizers, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: openmw-*
          path: dist
          merge-multiple: true

      - name: Zip the Windows folder
        # A release attaches files, so the folder becomes the zip here, named after itself.
        run: |
          cd dist
          for folder in */; do
            zip -qr "${folder%/}.zip" "$folder"
            rm -r "$folder"
          done
          ls -l

      - name: The draft release
        # `gh`, which every runner carries, rather than an action that wraps it.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" dist/*
