# The dependency sets: the libraries `vcpkg.json` names, built static by `omw deps-set` for each system and
# published as the release `deps-<digest>`, whose archives `pins.py` names and every build downloads. A set
# is built once for its inputs: a run whose digest is published already does nothing. Linux builds in
# AlmaLinux 8, whose glibc is older than every system the set serves.
name: Dependency sets

on:
  push:
    paths:
      - vcpkg.json
      - vcpkg-configuration.json
      - "vcpkg/**"
      - env/release-base.Dockerfile
      - env/install_almalinux_deps.sh
      - tools/omw/pins.py
      - tools/omw/depsset.py
      - .github/workflows/deps.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  digest:
    name: digest
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.digest.outputs.tag }}
      published: ${{ steps.digest.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python3 omw deps-set --digest)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    name: linux
    needs: digest
    if: needs.digest.outputs.published == 'false'
    runs-on: ubuntu-26.04
    container: almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b
    permissions:
      contents: read
    timeout-minutes: 360
    steps:
      # The checkout needs Git in the container before it can run.
      - run: dnf install -y git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: env/install_almalinux_deps.sh
      # Built packages, so a run cut off by the time limit resumes where it stopped and a set whose inputs
      # moved rebuilds only the ports they reach; the newest alone is kept (`caches`).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/vcpkg-binary-cache
          key: vcpkg-linux-${{ needs.digest.outputs.tag }}-${{ github.run_id }}
          restore-keys: vcpkg-linux-
      - run: source /opt/rh/gcc-toolset-15/enable && python3.12 omw deps-set
        shell: bash
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/vcpkg-binary-cache
          key: vcpkg-linux-${{ needs.digest.outputs.tag }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: set-linux
          path: deps/sets/vcpkg-x64-linux-openmw.tar.gz.*
          compression-level: 0

  windows:
    name: windows
    needs: digest
    if: needs.digest.outputs.published == 'false'
    runs-on: windows-2025-vs2026
    permissions:
      contents: read
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/vcpkg-binary-cache
          key: vcpkg-windows-${{ needs.digest.outputs.tag }}-${{ github.run_id }}
          restore-keys: vcpkg-windows-
      - run: python omw deps-set
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps/vcpkg-binary-cache
          key: vcpkg-windows-${{ needs.digest.outputs.tag }}-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: set-windows
          path: deps/sets/vcpkg-x64-windows-openmw.tar.gz.*
          compression-level: 0

  # One binary cache a system and branch. Each run saves its own, as a key is written once: a run cut off saves
  # what it built, and the next resumes from it by prefix. Every older one is deleted here, or each set's copy (0.5
  # to 0.8 GB Linux's, 2.7 GB Windows') stays in the repository's 10 GB until eviction takes master's compiler
  # caches with it. By branch, as a branch restores its own caches and master's alone.
  caches:
    name: caches
    needs: [digest, linux, windows]
    if: always() && needs.digest.outputs.published == 'false'
    runs-on: ubuntu-26.04
    permissions:
      actions: write
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for system in linux windows; do
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "vcpkg-$system-" \
                --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' \
              | xargs -r -n1 gh cache delete --repo "$GITHUB_REPOSITORY"
          done

  publish:
    name: publish
    needs: [digest, linux, windows]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: sets
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.digest.outputs.tag }}
          SHA: ${{ github.sha }}
        run: |
          cd sets
          sha256sum vcpkg-*.tar.gz.* > SHA256SUMS
          # Never the latest release, which the game's are: the AppImage's update information asks for the
          # latest, and a set made latest took the game's place on the repository's page.
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --latest=false \
            --notes "The dependency set built from $SHA by omw deps-set; pins.py names these parts by their SHA-256." \
            vcpkg-*.tar.gz.* SHA256SUMS
