# The two SDKs the ray tracer builds against and no package brings: Vulkan from LunarG and NGX from
# NVIDIA's public repository, fetched, checked and exported the way `rtx` reads them.
#
# **Vulkan from LunarG on both systems.** The backend needs VK_EXT_ray_tracing_invocation_reorder,
# which entered the SDK at 1.4.333; the distro's packages and LunarG's apt repository stop short of
# it. Each system's version is pinned with the checksum LunarG publishes beside the file in its own
# listing (sdk.lunarg.com/sdk/files.json). No runner has a device, so no layers.
name: Ray tracing SDKs
description: The Vulkan SDK and NGX, per system.

inputs:
  cache:
    description: Whether to restore and save the Vulkan SDK cache; false for a release.
    default: "true"

runs:
  using: composite
  steps:
    - name: Vulkan SDK cache
      id: vulkan
      if: inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/vulkan-sdk
        # This file's own hash beside the system, because what is cached is what the steps below
        # extract, and a change to that list or to a pin must not find the old subset.
        key: vulkan-sdk-${{ runner.os }}-${{ hashFiles('.github/actions/rtx-sdks/action.yml') }}

    - name: Vulkan SDK download
      if: steps.vulkan.outputs.cache-hit != 'true' && runner.os == 'Linux'
      # Only what the build needs out of 330 MB: the headers, SPIR-V's among them, the loader the tests
      # start against, and glslc, spirv-val and spirv-opt, which link nothing of the SDK's. The loader
      # sits in its own prefix, `lib/VulkanLoader`, which is where the SDK's `setup-env.sh` points too.
      shell: bash
      env:
        VERSION: 1.4.357.1
        SHA256: 4b41e3b30e8aedaa5dac7c136561ab463eb316a25a54e2c6245f2c299ea1fb85
      run: |
        tarball="vulkansdk-linux-x86_64-${VERSION}.tar.xz"
        curl --fail --retry 3 -L -o "$tarball" \
          "https://sdk.lunarg.com/sdk/download/${VERSION}/linux/${tarball}"
        echo "${SHA256}  ${tarball}" | sha256sum -c -
        mkdir -p "${RUNNER_TEMP}/vulkan-sdk"
        tar -xJf "$tarball" -C "${RUNNER_TEMP}/vulkan-sdk" --strip-components=1 --wildcards \
          '*/x86_64/include/*' '*/x86_64/lib/VulkanLoader/lib/libvulkan.so*' \
          '*/x86_64/bin/glslc' '*/x86_64/bin/spirv-val' '*/x86_64/bin/spirv-opt'
        rm "$tarball"

    - name: Vulkan SDK download
      if: steps.vulkan.outputs.cache-hit != 'true' && runner.os == 'Windows'
      # The same things, out of a 288 MB installer that has no tarball beside it: it is run unattended
      # into a directory of its own, and the headers, the import library, glslc, spirv-val and
      # spirv-opt are taken out of it. The loader comes separately, from the runtime components LunarG
      # publishes for redistribution: the installer leaves it to the driver, and a runner has no
      # driver. Everything else the installer put down is left behind.
      shell: bash
      env:
        VERSION: 1.4.357.0
        SHA256: 81f474711e9042f4cd22b31b2f7a8870db2e428b21586fb43dd80150be97310d
        LOADER_SHA256: a14672efed15aafc7f5a16572d35cd3a3416eadf670aeee3cdf50ee32d5fbf83
      run: |
        installer="vulkansdk-windows-X64-${VERSION}.exe"
        curl --fail --retry 3 -L -o "$installer" \
          "https://sdk.lunarg.com/sdk/download/${VERSION}/windows/${installer}"
        echo "${SHA256}  ${installer}" | sha256sum -c -
        full="$(cygpath "$RUNNER_TEMP")/vulkan-sdk-installed"
        # Through PowerShell's own wait, since the installer is a windowed program and a shell that
        # does not wait on one would test for its files before it wrote them.
        powershell -NoProfile -Command "Start-Process -Wait -FilePath './$installer' -ArgumentList @('--root', '$(cygpath -w "$full")', '--accept-licenses', '--default-answer', '--confirm-command', 'install')"
        for file in Include/vulkan/vulkan.h Include/spirv/unified1/spirv.hpp Lib/vulkan-1.lib \
          Bin/glslc.exe Bin/spirv-val.exe Bin/spirv-opt.exe; do
          test -f "$full/$file"
        done

        loader="VulkanRT-X64-${VERSION}-Components.zip"
        curl --fail --retry 3 -L -o "$loader" \
          "https://sdk.lunarg.com/sdk/download/${VERSION}/windows/${loader}"
        echo "${LOADER_SHA256}  ${loader}" | sha256sum -c -

        sdk="$(cygpath "$RUNNER_TEMP")/vulkan-sdk"
        mkdir -p "$sdk/Lib" "$sdk/Bin"
        cp -r "$full/Include" "$sdk/"
        cp "$full/Lib/vulkan-1.lib" "$sdk/Lib/"
        cp "$full/Bin/glslc.exe" "$full/Bin/spirv-val.exe" "$full/Bin/spirv-opt.exe" "$sdk/Bin/"
        "/c/Program Files/7-Zip/7z.exe" e -y -o"$sdk/Bin" "$loader" "${loader%.zip}/x64/vulkan-1.dll" > /dev/null
        test -f "$sdk/Bin/vulkan-1.dll"
        rm "$installer" "$loader"

    - name: Vulkan SDK environment
      # What `setup-env.sh` would export: FindVulkan reads VULKAN_SDK for the headers and, on Linux,
      # CMAKE_PREFIX_PATH for the loader's prefix; the test binaries load the loader from
      # LD_LIBRARY_PATH or from the PATH beside glslc. Each tool is then run once, so one the subset
      # left out, or one that needs a library it did not bring, stops here by name and not in the
      # middle of a configure.
      shell: bash
      # zizmor: ignore[github-env] every value written is a path on the runner, which nothing a pull request writes reaches
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          sdk="${RUNNER_TEMP}/vulkan-sdk/x86_64"
          echo "VULKAN_SDK=${sdk}" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=${sdk}/lib/VulkanLoader" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${sdk}/lib/VulkanLoader/lib" >> "$GITHUB_ENV"
          bin="${sdk}/bin"
          echo "$bin" >> "$GITHUB_PATH"
        else
          sdk="$(cygpath "$RUNNER_TEMP")/vulkan-sdk"
          bin="$sdk/Bin"
          echo "VULKAN_SDK=$(cygpath -w "$sdk")" >> "$GITHUB_ENV"
          echo "$(cygpath -w "$bin")" >> "$GITHUB_PATH"
        fi
        for tool in glslc spirv-val spirv-opt; do
          "$bin/$tool" --version
        done

    - name: NGX version
      # The one components/rtxvulkan/CMakeLists.txt asks FindNGX for, exactly, read off it so the two
      # cannot name different releases. NVIDIA tags each release as the version with a `v`.
      id: ngx
      shell: bash
      run: |
        version="$(tr -d '\r' < components/rtxvulkan/CMakeLists.txt \
          | sed -n 's/^ *find_package(NGX \([0-9.]*\) EXACT REQUIRED)$/\1/p')"
        test -n "$version"
        echo "tag=v$version" >> "$GITHUB_OUTPUT"
        if [ "$RUNNER_OS" = Linux ]; then
          printf 'paths<<EOF\ninclude\nlib/Linux_x86_64/rel\nEOF\n' >> "$GITHUB_OUTPUT"
        else
          printf 'paths<<EOF\ninclude\nlib/Windows_x86_64/rel\nlib/Windows_x86_64/x64\nEOF\n' >> "$GITHUB_OUTPUT"
        fi

    - name: NGX SDK
      # A sparse checkout of NVIDIA's public repository at that tag, of what this system reads — the
      # headers, the static library and the release features, and neither the debug features nor the
      # other system's: about 150 MB either way.
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: NVIDIA/DLSS
        ref: ${{ steps.ngx.outputs.tag }}
        path: dlss
        persist-credentials: false
        sparse-checkout: ${{ steps.ngx.outputs.paths }}

    - name: NGX_ROOT, the one way FindNGX is pointed at a checkout
      shell: bash
      # zizmor: ignore[github-env] the workspace's path, which nothing a pull request writes reaches
      run: echo "NGX_ROOT=${GITHUB_WORKSPACE}/dlss" >> "$GITHUB_ENV"
