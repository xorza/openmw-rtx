# The Claude GitHub App's token for `upstream.yml`, which opens the merge's pull request and pushes its fixes as the
# app: GitHub starts no workflow on what `GITHUB_TOKEN` opens or pushes, and the pull request's CI is its judge.
#
# **The exchange is the pinned `anthropics/claude-code-action`'s own** (`src/github/token.ts`), copied: the run's
# identity from GitHub, for the action's audience, handed to the action's service. No documented interface, so it
# may change with no notice, and what this adds to the copy is a failure that says which half refused, with what
# status and in whose words. An app of the repository's own (`actions/create-github-app-token`) is the documented
# way, and `.notes/todo.md` holds the question.
#
# The job needs `id-token: write`. A job that uses the token gives it back with `app-token-revoke`.
name: The Claude GitHub App's token
description: Exchanges the run's identity for a token of the Claude GitHub App, or fails saying which half refused.

outputs:
  token:
    description: The app's token, masked in every log of the job.
    value: ${{ steps.exchange.outputs.token }}

runs:
  using: composite
  steps:
    - id: exchange
      shell: bash
      run: |
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
          echo "::error::the run has no identity to exchange for the app's token: its job lacks id-token: write"
          exit 1
        fi
        answer="$RUNNER_TEMP/app-token-answer"
        trap 'rm -f "$answer"' EXIT

        # Any status of success, as the copied exchange took any: which one the service answers with is not written
        # down either.
        succeeded() {
          [[ "$1" == 2[0-9][0-9] ]]
        }

        # What a refusal said, on one line. An answer of success is never printed, as it may hold a token under a
        # name this step does not read: its fields' names alone.
        said() {
          if succeeded "$1"; then
            echo "an answer that holds none, of the fields $(jq -r 'keys | join(", ")' "$answer" 2> /dev/null || echo "of no JSON object")"
          else
            head -c 300 "$answer" 2> /dev/null | tr '\r\n' '  ' || true
          fi
        }

        # Without `-f`, so a refusal's own words are read. Three tries against a server that fails once in a while,
        # each bounded, as the job's own limit is all that would end one that hung; a status of 000 is a server
        # never reached.
        status=$(curl -sS --retry 3 --max-time 30 -o "$answer" -w '%{http_code}' \
          -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=claude-code-github-action") || true
        identity=""
        if succeeded "$status"; then
          identity=$(jq -r '.value // empty' "$answer" 2> /dev/null) || true
        fi
        if [ -z "$identity" ]; then
          echo "::error::GitHub gave the run no identity token to exchange (HTTP $status): $(said "$status")"
          exit 1
        fi
        echo "::add-mask::$identity"

        # The identity's answer goes first: a service never reached writes none, and the one before it would be
        # read as its words.
        rm -f "$answer"
        status=$(curl -sS --retry 3 --max-time 30 -o "$answer" -w '%{http_code}' -X POST \
          -H "Authorization: Bearer $identity" \
          https://api.anthropic.com/api/github/github-app-token-exchange) || true
        token=""
        if succeeded "$status"; then
          token=$(jq -r '.token // .app_token // empty' "$answer" 2> /dev/null) || true
        fi
        if [ -z "$token" ]; then
          echo "::error::the Claude GitHub App's exchange gave no token (HTTP $status): $(said "$status"). The exchange is the pinned claude-code-action's own and no documented interface: compare this step with src/github/token.ts as the action has it now"
          exit 1
        fi
        echo "::add-mask::$token"
        echo "token=$token" >> "$GITHUB_OUTPUT"
