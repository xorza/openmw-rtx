# What every build of the tree takes from its system before `omw` configures it: the Python `omw` runs
# on, upstream's package list on Linux with what `omw` asks for there, the cache of what `omw` fetches
# into deps/, the compiler cache, and `omw bootstrap`: the Vulkan SDK, fetched the way a fresh desk
# fetches it.
name: OpenMW dependencies
description: The packages and SDKs a build of the tree needs, per system.

inputs:
  cache:
    description: Whether to restore and save the deps/ cache and the compiler cache; false for a release.
    default: "true"
  ccache-key:
    description: The compiler cache's name, which begins no other job's; none, and the job keeps none.
    default: ""
  ccache-size:
    description: How large the compiler cache may grow.
    default: 1000M

runs:
  using: composite
  steps:
    - name: Python
      # The oldest Python `omw` supports, so a feature of a later one fails here and not on a desk.
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.11"

    - name: Linux packages
      # The one list, which the container a desk builds a release in installs too.
      if: runner.os == 'Linux'
      shell: bash
      run: sudo CI/install_ubuntu_deps.sh

    - name: Vulkan SDK cache
      # On Linux, the SDK alone: the rest of deps/ is small, or fetched by one job only.
      if: runner.os == 'Linux' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: deps/vulkan-sdk-*
        key: vulkan-sdk-${{ runner.os }}-${{ hashFiles('tools/omw/pins.py', 'tools/omw/deps.py') }}

    - name: Windows dependencies cache
      # Everything `omw` fetches into deps/ on Windows — upstream's prebuilt set, Qt
      # and the Vulkan SDK. The key names the
      # tags upstream pins and the file `omw` pins the rest in, so a bump of either saves afresh; an
      # older cache is restored all the same, because `omw` judges each thing by the directory it
      # leaves and fetches only what a bump changed, and `omw bootstrap` removes what no pin names.
      if: runner.os == 'Windows' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: deps
        key: deps-${{ runner.os }}-${{ hashFiles('CI/deps_versions.msvc.sh', 'tools/omw/pins.py') }}
        restore-keys: deps-${{ runner.os }}-

    - name: The Vulkan SDK
      shell: bash
      run: python omw bootstrap

    - name: Compiler cache
      if: inputs.ccache-key != '' && inputs.cache == 'true'
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ${{ inputs.ccache-key }}
        max-size: ${{ inputs.ccache-size }}
        # Saved on master alone, and read by every other ref: a branch's own copies would evict
        # master's. Each run saves a new entry and keeps the old ones, so the repository's ten
        # gigabytes hold every master cache once only after `gh cache delete` has cleared the older
        # copies by hand.
        save: ${{ github.ref == 'refs/heads/master' }}
