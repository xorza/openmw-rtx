name: OpenMW dependencies
description: The packages and SDKs a build of the tree needs, per system.

inputs:
  cache:
    description: Whether to restore and save the job's caches; false for a release.
    default: "true"
  cache-key:
    description: The name of the job's caches, the driver's tools, the FetchContent archives and the compiler cache, which begins no other job's; none, and the job keeps none.
    default: ""
  ccache-size:
    description: How large the compiler cache may grow.
    default: 1000M

runs:
  using: composite
  steps:
    - name: Python
      # The oldest Python `omw` supports, so a later one's feature fails here and not on a desk. Linux's
      # is the container's, which the packages below install.
      if: runner.os == 'Windows'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - name: Linux packages
      # In the AlmaLinux 8 container, as the release base installs them, with gcc-toolset-15 and Python 3.12
      # made the job's own for every later step: what `/opt/rh/gcc-toolset-15/enable` sets, and `python`. On
      # the runner itself, where the tsan leg runs, Ubuntu's, as a desk on it installs them.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [ -f /etc/almalinux-release ]; then
          env/install_almalinux_deps.sh
          ln -sf /usr/bin/python3.12 /usr/local/bin/python
          echo /opt/rh/gcc-toolset-15/root/usr/bin >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/rh/gcc-toolset-15/root/usr/lib64:/opt/rh/gcc-toolset-15/root/usr/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/opt/rh/gcc-toolset-15/root/usr/lib64/pkgconfig" >> "$GITHUB_ENV"
        else
          sudo env/install_ubuntu_deps.sh
          sudo ln -sf /usr/bin/python3 /usr/local/bin/python
        fi

    # The caches below are the job's own, keyed by its `cache-key`, and saved on master alone, as the compiler
    # cache is: a branch's copies would evict master's from the repository's 10 GB, past which storage is billed.
    # A branch restores them, and saves nothing.
    - name: The driver's tools
      # The folders `omw` keeps its pinned tools in, each named after its pins: the key moves with a tool and
      # with nothing else, not with a set pinned anew.
      if: inputs.cache-key != '' && inputs.cache == 'true'
      id: tools
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.cache-key }}
      run: |
        folders="$(python omw bootstrap --cached-tools)"
        {
          echo "paths<<EOF"
          echo "$folders"
          echo "EOF"
          echo "key=tools-$CACHE_KEY-$(echo "$folders" | sha256sum | cut -c1-16)"
        } >> "$GITHUB_OUTPUT"

    - name: The driver's tools cache
      if: inputs.cache-key != '' && inputs.cache == 'true' && github.ref == 'refs/heads/master'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.tools.outputs.paths }}
        key: ${{ steps.tools.outputs.key }}

    - name: The driver's tools cache, restored
      if: inputs.cache-key != '' && inputs.cache == 'true' && github.ref != 'refs/heads/master'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.tools.outputs.paths }}
        key: ${{ steps.tools.outputs.key }}

    - name: The FetchContent archives' pins
      # Every archive is declared with its `URL_HASH`, so the hashes are what the archives are: the
      # key moves with a pin and with nothing else.
      if: inputs.cache-key != '' && inputs.cache == 'true'
      id: fetched
      shell: bash
      env:
        CACHE_KEY: ${{ inputs.cache-key }}
      run: echo "key=fetchcontent-$CACHE_KEY-$(git grep -h URL_HASH -- '*CMakeLists.txt' '*.cmake' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    # Where CMake keeps each archive it downloads, and skips the download of one whose hash matches
    # (`FETCHCONTENT_BASE_DIR`): without it every leg downloaded every source again, and CMake retries no
    # HTTP error, so one 504 from GitHub failed the leg at configure. A leg's own, since a flavour fetches
    # what its options build.
    - name: FetchContent archives cache
      if: inputs.cache-key != '' && inputs.cache == 'true' && github.ref == 'refs/heads/master'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: out/*/_deps/*-tmp
        key: ${{ steps.fetched.outputs.key }}

    - name: FetchContent archives cache, restored
      if: inputs.cache-key != '' && inputs.cache == 'true' && github.ref != 'refs/heads/master'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: out/*/_deps/*-tmp
        key: ${{ steps.fetched.outputs.key }}

    - name: The vcpkg set
      shell: bash
      run: python omw bootstrap

    - name: Compiler cache
      if: inputs.cache-key != '' && inputs.cache == 'true'
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ${{ inputs.cache-key }}
        max-size: ${{ inputs.ccache-size }}
        save: ${{ github.ref == 'refs/heads/master' }}
