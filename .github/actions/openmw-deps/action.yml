name: OpenMW dependencies
description: The packages and SDKs a build of the tree needs, per system.

inputs:
  cache:
    description: Whether to restore and save the deps/ cache and the compiler cache; false for a release.
    default: "true"
  ccache-key:
    description: The compiler cache's name, which begins no other job's; none, and the job keeps none.
    default: ""
  ccache-size:
    description: How large the compiler cache may grow.
    default: 1000M

runs:
  using: composite
  steps:
    - name: Python
      # The oldest Python `omw` supports, so a later one's feature fails here and not on a desk.
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - name: Linux packages
      # A passing install took sixteen minutes, and one a stalled mirror held took 110.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo timeout --kill-after=1m 30m CI/install_ubuntu_deps.sh || {
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::the Linux packages took past 30 minutes, a stalled mirror: run the job again"
          fi
          exit "$status"
        }

    - name: Vulkan SDK cache
      # The SDK alone: the rest of deps/ is small on Linux, or fetched by one job only.
      if: runner.os == 'Linux' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: deps/vulkan-sdk-*
        key: vulkan-sdk-${{ runner.os }}-${{ hashFiles('tools/omw/pins.py', 'tools/omw/deps.py') }}

    - name: Windows dependencies cache
      # An older cache is restored too: `omw` fetches only what a bump changed, and `omw bootstrap`
      # removes what no pin names.
      if: runner.os == 'Windows' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: deps
        key: deps-${{ runner.os }}-${{ hashFiles('CI/deps_versions.msvc.sh', 'tools/omw/pins.py', 'tools/omw/deps.py') }}
        restore-keys: deps-${{ runner.os }}-

    - name: The Vulkan SDK
      shell: bash
      run: python omw bootstrap

    - name: Compiler cache
      if: inputs.ccache-key != '' && inputs.cache == 'true'
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ${{ inputs.ccache-key }}
        max-size: ${{ inputs.ccache-size }}
        # On master alone: a branch's copies would evict master's. The repository's cache limit is
        # the free 10 GB: past it storage is billed, and with the budget spent every cache is
        # read-only.
        save: ${{ github.ref == 'refs/heads/master' }}
