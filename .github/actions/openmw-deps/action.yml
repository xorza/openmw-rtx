name: OpenMW dependencies
description: The packages and SDKs a build of the tree needs, per system.

inputs:
  cache:
    description: Whether to restore and save the deps/ cache, the FetchContent archives and the compiler cache; false for a release.
    default: "true"
  cache-key:
    description: The name of the job's compiler cache and FetchContent archives, which begins no other job's; none, and the job keeps neither.
    default: ""
  ccache-size:
    description: How large the compiler cache may grow.
    default: 1000M

runs:
  using: composite
  steps:
    - name: Python
      # The oldest Python `omw` supports, so a later one's feature fails here and not on a desk.
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.11"

    - name: Linux packages cache
      # The packages downloaded, keyed by the scripts that list them, so a run reaches the mirror for its
      # indices and for what changed alone: a mirror that stalled between files ended a job at the limit
      # (run 42553703270). The packages alone, and not the folder `partial` apt downloads into.
      if: runner.os == 'Linux' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: apt-cache/*.deb
        key: apt-${{ runner.os }}-${{ hashFiles('CI/install_ubuntu_deps.sh', 'CI/install_debian_deps.sh') }}

    - name: Linux packages
      # The slowest of 145 passing jobs took nine minutes, and a job run again on another runner took
      # two. What apt held at the limit is printed, as `-qq` and `/dev/null` hide it during the install.
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo timeout --kill-after=1m 15m CI/install_ubuntu_deps.sh || {
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
            echo "::error::the Linux packages took past 15 minutes: run the job again"
            sudo ls -l apt-cache/partial /var/cache/apt/archives/partial /var/lib/apt/lists/partial || true
            sudo tail -n 20 /var/log/dpkg.log /var/log/apt/term.log || true
          fi
          exit "$status"
        }
        # The cache's save reads the packages as the runner's user, after apt wrote them as root.
        sudo chown -R "$(id -u):$(id -g)" apt-cache

    - name: Vulkan SDK and CMake cache
      # The SDK and CMake alone: the rest of deps/ is small on Linux, or fetched by one job only.
      if: runner.os == 'Linux' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps/vulkan-sdk-*
          deps/cmake-*
        key: vulkan-sdk-${{ runner.os }}-${{ hashFiles('tools/omw/pins.py', 'tools/omw/deps.py') }}

    - name: Windows dependencies cache
      # An older cache is restored too: `omw` fetches only what a bump changed, and `omw bootstrap`
      # removes what no pin names.
      if: runner.os == 'Windows' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: deps
        key: deps-${{ runner.os }}-${{ hashFiles('CI/deps_versions.msvc.sh', 'tools/omw/pins.py', 'tools/omw/deps.py') }}
        restore-keys: deps-${{ runner.os }}-

    - name: The FetchContent archives' pins
      # Every archive is declared with its `URL_HASH`, so the hashes are what the archives are: the
      # key moves with a pin and with nothing else.
      if: inputs.cache-key != '' && inputs.cache == 'true'
      id: fetched
      shell: bash
      run: echo "digest=$(git grep -h URL_HASH -- '*CMakeLists.txt' '*.cmake' | sort | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - name: FetchContent archives cache
      # Where CMake keeps each archive it downloads, and skips the download of one whose hash
      # matches (`FETCHCONTENT_BASE_DIR`): without it every leg downloaded every source again, and
      # CMake retries no HTTP error, so one 504 from GitHub failed the leg at configure. A leg's
      # own, since a flavour fetches what its options build.
      if: inputs.cache-key != '' && inputs.cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: build-*/_deps/*-tmp
        key: fetchcontent-${{ inputs.cache-key }}-${{ steps.fetched.outputs.digest }}

    - name: The Vulkan SDK
      shell: bash
      run: python omw bootstrap

    - name: Compiler cache
      if: inputs.cache-key != '' && inputs.cache == 'true'
      uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
      with:
        key: ${{ inputs.cache-key }}
        max-size: ${{ inputs.ccache-size }}
        # On master alone: a branch's copies would evict master's. The repository's cache limit is
        # the free 10 GB: past it storage is billed, and with the budget spent every cache is
        # read-only.
        save: ${{ github.ref == 'refs/heads/master' }}
