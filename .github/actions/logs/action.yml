# One list for every job that builds, so a log one job learns to keep, every job keeps.
name: Build logs
description: Uploads a failed build's configuration, logs and crash reports.

inputs:
  name:
    description: The artifact's name, unique in the run.
    required: true
  build:
    description: The build directory, relative to the workspace.
    required: true
  more:
    description: Further paths to keep, one a line.
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.name }}
        path: |
          ${{ inputs.build }}/CMakeCache.txt
          ${{ inputs.build }}/**/*.log
          ${{ inputs.build }}/test-output/crash-matrix/
          ${{ inputs.more }}
