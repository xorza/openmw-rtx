# The token `app-token` gave, given back once its one use is done, or was not reached: after any outcome, by
# `if: always()` on the step that names this. A token not given back lasts its hour.
name: The Claude GitHub App's token, revoked
description: Revokes a token of the Claude GitHub App.

inputs:
  token:
    description: The token `app-token` gave.
    required: true

runs:
  using: composite
  steps:
    - shell: bash
      env:
        APP_TOKEN: ${{ inputs.token }}
      run: |
        curl -sS -o /dev/null -X DELETE -H "Accept: application/vnd.github+json" \
          -H "Authorization: Bearer $APP_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
          "${GITHUB_API_URL:-https://api.github.com}/installation/token" || true
