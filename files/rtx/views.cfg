# Places worth looking at, by name.
#
# A view id is the unit of comparison across commits: the same name renders the same frame today and
# after a change, which is what makes a screenshot evidence rather than an anecdote. Seed it with
# places that stress different things, not with places that are pretty.
#
#   cell   addressed the way Morrowind does: a pair of integers is an exterior, anything else is an
#          interior's name
#   pos    where the camera stands. Left out, it gets a view of the whole cell from outside, which
#          is a fine establishing shot and a poor look at an interior
#   look   what it points at
#
# Press P in the window to print the camera as a block you can paste back in here.

[seyda-neen-ship]
